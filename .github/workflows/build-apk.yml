name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdkmanager "ndk;26.1.10909125"

    - name: Configure NDK path
      run: |
        NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
        echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        
        mkdir -p trans_engine/.cargo
        cat > trans_engine/.cargo/config.toml << EOF
        [target.aarch64-linux-android]
        linker = "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
        ar = "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
        EOF

    # 🆕 GRADLE WRAPPER OLUŞTUR (gradlew yoksa)
    - name: Generate Gradle Wrapper
      run: |
        # gradlew yoksa gradle wrapper oluştur
        if [ ! -f "./gradlew" ]; then
          echo "📦 Gradle wrapper oluşturuluyor..."
          gradle wrapper --gradle-version 8.2
        fi
        chmod +x gradlew
        ls -la gradlew

    - name: Build Rust engine
      run: |
        cd trans_engine
        cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
        ls -lh ../app/src/main/jniLibs/arm64-v8a/

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TransEngine-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        name: TransEngine ${{ github.ref_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
