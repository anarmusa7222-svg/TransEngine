name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle Cache
      uses: gradle/actions/setup-gradle@v3

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Install cargo-ndk
      run: cargo install cargo-ndk

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: sdkmanager "ndk;26.1.10909125"

    - name: Configure NDK path
      run: |
        NDK_PATH="$ANDROID_HOME/ndk/26.1.10909125"
        echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
        
        mkdir -p trans_engine/.cargo
        cat > trans_engine/.cargo/config.toml << EOF
        [target.aarch64-linux-android]
        linker = "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"
        ar = "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
        EOF

    # 🆕 KESİN ÇÖZÜM: Resmi Gradle 8.2 Wrapper dosyalarını doğrudan indir
    - name: Setup Gradle 8.2 Wrapper (Official)
      run: |
        mkdir -p gradle/wrapper
        
        # 1. Properties dosyasını oluştur
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # 2. Resmi gradle-wrapper.jar'ı indir (v8.2.0)
        curl -s -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradle/wrapper/gradle-wrapper.jar
        
        # 3. Resmi gradlew scriptlerini indir (v8.2.0)
        curl -s -L -o gradlew https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew
        chmod +x gradlew
        
        curl -s -L -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew.bat
        
        echo "✅ Gradle 8.2 Wrapper başarıyla kuruldu!"
        ls -la gradle/wrapper/
        ls -la gradlew

    - name: Build Rust engine
      run: |
        cd trans_engine
        cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
        ls -lh ../app/src/main/jniLibs/arm64-v8a/

    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: TransEngine-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        name: TransEngine ${{ github.ref_name }}
        body: "Otomatik oluşturulan APK sürümü."
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
